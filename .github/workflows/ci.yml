name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run python scripts/check_repository_data.py
      - run: uv run obd-mcp check-config --config examples/obd-mcp.toml
      - run: uv run obd-mcp check-config --config examples/elm327.example.toml

  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-14
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - run: uv run pytest

  package:
    needs: [quality, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv build --build-constraints build-constraints.txt --require-hashes
      - run: uv run twine check dist/*
      - run: uv run python scripts/check_distribution.py dist/*
      - run: mkdir rebuilt
      - run: >-
          uv build dist/*.tar.gz --wheel --out-dir rebuilt
          --build-constraints build-constraints.txt --require-hashes
      - run: cmp dist/*.whl rebuilt/*.whl
      - run: |
          python3 -m venv "${RUNNER_TEMP}/fresh-install"
          "${RUNNER_TEMP}/fresh-install/bin/pip" install dist/*.whl
          "${RUNNER_TEMP}/fresh-install/bin/obd-mcp" --version
          "${RUNNER_TEMP}/fresh-install/bin/obd-mcp" --help
          "${RUNNER_TEMP}/fresh-install/bin/obd-mcp" check-config --config examples/obd-mcp.toml
          "${RUNNER_TEMP}/fresh-install/bin/python" scripts/smoke_mcp.py \
            --command "${RUNNER_TEMP}/fresh-install/bin/obd-mcp"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  wheel-smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Install exact wheel
        run: >-
          python -c "import glob, subprocess, sys;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
          *glob.glob('dist/*.whl')])"
      - run: obd-mcp --version
      - run: obd-mcp --help
      - run: obd-mcp check-config --config examples/obd-mcp.toml
      - run: python scripts/smoke_mcp.py --command obd-mcp
