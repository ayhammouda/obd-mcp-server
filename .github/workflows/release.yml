name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to build
        required: true
        type: string
      publish_to_pypi:
        description: Publish the verified artifact to PyPI
        required: true
        default: false
        type: boolean
      confirm_project:
        description: Type obd-mcp-server to enable the publish job
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify tag and main ancestry
        run: |
          case "${RELEASE_TAG}" in
            v[0-9]*) ;;
            *) echo "Tag must start with v and a digit" >&2; exit 1 ;;
          esac
          test "$(git describe --tags --exact-match HEAD)" = "${RELEASE_TAG}"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv run pip-audit
      - run: uv run pip-audit -r build-constraints.txt --disable-pip
      - run: uv run pip-licenses --format=markdown
      - run: uv run python scripts/check_repository_data.py
      - run: uv run obd-mcp check-config --config examples/obd-mcp.toml
      - run: uv run obd-mcp check-config --config examples/elm327.example.toml
      - run: uv build --build-constraints build-constraints.txt --require-hashes
      - run: uv run twine check dist/*
      - run: uv run python scripts/check_distribution.py dist/*
      - run: mkdir rebuilt
      - run: >-
          uv build dist/*.tar.gz --wheel --out-dir rebuilt
          --build-constraints build-constraints.txt --require-hashes
      - run: cmp dist/*.whl rebuilt/*.whl
      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${RELEASE_TAG}" = "v${PACKAGE_VERSION}"
          grep -F "## [${PACKAGE_VERSION}] - " CHANGELOG.md
          ! grep -F "## [${PACKAGE_VERSION}] - Unreleased" CHANGELOG.md
      - name: Record artifact hashes
        run: shasum -a 256 dist/*
      - name: Fresh-install smoke
        run: |
          python3 -m venv "${RUNNER_TEMP}/fresh-install"
          "${RUNNER_TEMP}/fresh-install/bin/pip" install dist/*.whl
          "${RUNNER_TEMP}/fresh-install/bin/obd-mcp" --version
          "${RUNNER_TEMP}/fresh-install/bin/obd-mcp" --help
          "${RUNNER_TEMP}/fresh-install/bin/obd-mcp" check-config --config examples/obd-mcp.toml
          "${RUNNER_TEMP}/fresh-install/bin/python" scripts/smoke_mcp.py \
            --command "${RUNNER_TEMP}/fresh-install/bin/obd-mcp"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions-${{ inputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: >-
      inputs.publish_to_pypi == true &&
      inputs.confirm_project == 'obd-mcp-server'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions-${{ inputs.tag }}
          path: dist
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@2834a314042ef964da07689278dd1e9d773e8afd # v1.14.1
        with:
          packages-dir: dist/

  github-release:
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      (
        inputs.publish_to_pypi == false ||
        needs.publish.result == 'success'
      )
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions-${{ inputs.tag }}
          path: dist
      - name: Create checksums
        run: sha256sum dist/* > SHA256SUMS
      - name: Create GitHub release from verified artifacts
        run: >-
          gh release create "${RELEASE_TAG}" dist/* SHA256SUMS
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "${RELEASE_TAG}"
