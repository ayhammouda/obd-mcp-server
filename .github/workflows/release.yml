name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to build
        required: true
        type: string
      publish_to_pypi:
        description: Publish the verified artifact to PyPI
        required: true
        default: false
        type: boolean
      create_github_release:
        description: Publish an immutable GitHub release from the verified artifacts
        required: true
        default: false
        type: boolean
      confirm_tag:
        description: Type the exact tag to enable any external publication
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CONFIRM_TAG: ${{ inputs.confirm_tag }}
      CREATE_GITHUB_RELEASE: ${{ inputs.create_github_release }}
      PUBLISH_TO_PYPI: ${{ inputs.publish_to_pypi }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify release intent, annotated tag, and current main
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be a v-prefixed semantic version" >&2
            exit 1
          fi
          if [[ "${PUBLISH_TO_PYPI}" == "true" && "${CREATE_GITHUB_RELEASE}" != "true" ]]; then
            echo "PyPI publication requires a matching GitHub release" >&2
            exit 1
          fi
          if [[ "${PUBLISH_TO_PYPI}" == "true" || "${CREATE_GITHUB_RELEASE}" == "true" ]]; then
            test "${CONFIRM_TAG}" = "${RELEASE_TAG}"
          fi
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = "tag"
          test "$(git describe --tags --exact-match HEAD)" = "${RELEASE_TAG}"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          PACKAGE_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${RELEASE_TAG}" = "v${PACKAGE_VERSION}"
      - name: Validate MCP Registry metadata with pinned publisher
        run: |
          PUBLISHER_ARCHIVE="${RUNNER_TEMP}/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${PUBLISHER_ARCHIVE}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz"
          echo "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf  ${PUBLISHER_ARCHIVE}" \
            | sha256sum --check --strict
          tar -xzf "${PUBLISHER_ARCHIVE}" -C "${RUNNER_TEMP}" mcp-publisher
          "${RUNNER_TEMP}/mcp-publisher" validate server.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv run pip-audit
      - run: uv run pip-audit -r build-constraints.txt --disable-pip
      - run: uv run pip-licenses --format=markdown
      - run: uv run python scripts/check_repository_data.py
      - run: uv run obd-mcp check-config --config examples/obd-mcp.toml
      - run: uv run obd-mcp check-config --config examples/elm327.example.toml
      - run: uv build --build-constraints build-constraints.txt --require-hashes
      - run: uv run twine check dist/*
      - run: uv run python scripts/check_distribution.py dist/*
      - run: mkdir rebuilt
      - run: >-
          uv build dist/*.tar.gz --wheel --out-dir rebuilt
          --build-constraints build-constraints.txt --require-hashes
      - run: cmp dist/*.whl rebuilt/*.whl
      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${RELEASE_TAG}" = "v${PACKAGE_VERSION}"
          grep -F "## [${PACKAGE_VERSION}] - " CHANGELOG.md
          ! grep -F "## [${PACKAGE_VERSION}] - Unreleased" CHANGELOG.md
      - name: Record artifact hashes
        run: shasum -a 256 dist/*
      - name: Fresh-install smoke
        run: |
          python3 -m venv "${RUNNER_TEMP}/fresh-install"
          "${RUNNER_TEMP}/fresh-install/bin/pip" install dist/*.whl
          "${RUNNER_TEMP}/fresh-install/bin/obd-mcp" --version
          "${RUNNER_TEMP}/fresh-install/bin/obd-mcp" --help
          "${RUNNER_TEMP}/fresh-install/bin/obd-mcp" check-config --config examples/obd-mcp.toml
          "${RUNNER_TEMP}/fresh-install/bin/python" scripts/smoke_mcp.py \
            --command "${RUNNER_TEMP}/fresh-install/bin/obd-mcp"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions-${{ inputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  github-draft:
    if: >-
      inputs.create_github_release == true &&
      inputs.confirm_tag == inputs.tag
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions-${{ inputs.tag }}
          path: dist
      - name: Create checksums
        run: sha256sum dist/* > SHA256SUMS
      - name: Stage verified artifacts in a GitHub draft
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists" >&2
            exit 1
          fi
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${RELEASE_TAG}" \
            --draft
          gh release upload "${RELEASE_TAG}" dist/* SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}"

  publish:
    if: >-
      inputs.publish_to_pypi == true &&
      inputs.create_github_release == true &&
      inputs.confirm_tag == inputs.tag
    needs: [verify, github-draft]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions-${{ inputs.tag }}
          path: dist
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist/

  github-release:
    if: >-
      always() &&
      inputs.create_github_release == true &&
      inputs.confirm_tag == inputs.tag &&
      needs.verify.result == 'success' &&
      needs['github-draft'].result == 'success' &&
      (
        inputs.publish_to_pypi == false ||
        needs.publish.result == 'success'
      )
    needs: [verify, github-draft, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Publish the verified immutable GitHub release
        run: |
          IS_DRAFT="$(gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft \
            --jq .isDraft)"
          if [[ "${IS_DRAFT}" != "true" ]]; then
            echo "Release ${RELEASE_TAG} is missing or is not a draft" >&2
            exit 1
          fi
          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --latest
