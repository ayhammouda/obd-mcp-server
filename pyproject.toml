[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "obd-mcp-server"
version = "0.1.0"
description = "A local-first, read-only, extensible MCP server for vehicle diagnostics."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Aymen Hammouda" }]
keywords = [
  "automotive",
  "diagnostics",
  "mcp",
  "model-context-protocol",
  "obd",
  "obd-ii",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]
dependencies = [
  "mcp>=1.28.1,<2",
  "platformdirs>=4.5,<5",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
elm327 = ["py-obdii==0.10.5b0"]

[project.scripts]
obd-mcp = "obd_mcp.cli:main"

[project.urls]
Changelog = "https://github.com/ayhammouda/obd-mcp-server/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ayhammouda/obd-mcp-server#readme"
Issues = "https://github.com/ayhammouda/obd-mcp-server/issues"
Repository = "https://github.com/ayhammouda/obd-mcp-server"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "mypy>=1.18,<3",
  "pip-audit>=2.9,<3",
  "pip-licenses>=5.5,<6",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<0.15",
  "twine>=6.2,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/obd_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.gitignore",
  "/AGENTS.md",
]
include = [
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/SECURITY.md",
  "/THIRD_PARTY_NOTICES.md",
  "/build-constraints.in",
  "/build-constraints.txt",
  "/docs",
  "/examples",
  "/pyproject.toml",
  "/scripts",
  "/src",
]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=obd_mcp",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=85",
]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["obd_mcp"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = [
  "A",
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PT",
  "PTH",
  "RUF",
  "S",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["obd_mcp"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["obdii", "obdii.*"]
ignore_missing_imports = true
